name: Signaler un bug
description: Une génération échoue, un projet généré ne démarre pas, le site ne répond pas…
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Ce que vous attendiez, et ce qui s'est passé à la place.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Commande ou choix utilisés
      description: La commande `gabarit new …` complète, ou le lien de partage du générateur.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sortie de `gabarit doctor`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Message d'erreur ou journaux
      description: Relancez avec `-v` pour voir la sortie de composer et npm. Retirez les mots de passe.
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Système
      options: [Windows, macOS, Linux]
    validations:
      required: true
