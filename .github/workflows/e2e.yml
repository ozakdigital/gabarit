name: Site (parcours complet)

# Seulement quand le site, le cœur ou la matrice changent : le parcours démarre le vrai site (lent).
on:
  push:
    paths: ["apps/web/**", "packages/core/**", "config/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["apps/web/**", "packages/core/**", "config/**", ".github/workflows/e2e.yml"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Parcours complet du site (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/ui/package-lock.json
      - name: Démarre le site (interface + API)
        working-directory: .
        run: docker compose -f apps/web/compose.yaml up -d --build --wait
        env:
          APP_SECRET: ci-only-not-a-secret
      - run: npm ci --no-audit --no-fund
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test
        env:
          E2E_URL: http://localhost:8090
