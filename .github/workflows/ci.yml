name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly : installeurs réels (composer create-project, create-vite).
    - cron: "0 3 * * *"

jobs:
  lint:
    name: Lint (PHPStan 8, PHP-CS-Fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, zip
      - run: composer install --no-interaction --no-progress
      - run: make lint RUN=

  test:
    name: Tests + génération de toutes les combinaisons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, zip
      - run: composer install --no-interaction --no-progress
      - run: make test RUN=

  nightly:
    name: Nightly (installeurs réels)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, zip, pdo_pgsql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer install --no-interaction --no-progress
      - run: make test-nightly RUN=
