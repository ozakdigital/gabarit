# Site web de Gabarit : interface statique + API Symfony (PHP-FPM).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Les logos envoyés sont limités à 1 Mo par l'API ; marge pour le formulaire.
    client_max_body_size 2m;

    location /api/ {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/gabarit/apps/web/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/gabarit/apps/web/api/public;
        fastcgi_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
